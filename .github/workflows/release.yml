name: release

# Push a tag like v0.1.0 to build the binary tarball (for the AUR nebula-bin package) and the AppImage
# (for install.sh), and publish them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-declarative qt6-wayland libvterm curl file github-cli
      - uses: actions/checkout@v4
      - name: Build tarball and AppImage
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/release/build.sh "${GITHUB_REF_NAME#v}" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "nebula ${GITHUB_REF_NAME#v}" --generate-notes
