name: release

# Push a tag vX.Y.Z (matching `project(nebula VERSION X.Y.Z)` in CMakeLists.txt) to build and publish:
#   nebula-linux-{x86_64,aarch64}.tar.gz   portable build with Qt bundled (used by install.sh)
#   nebula_X.Y.Z_{amd64,arm64}.deb         Debian 13 / Ubuntu 25.04+
#   nebula-X.Y.Z-1.{x86_64,aarch64}.rpm    Fedora 41+
#   nebula-X.Y.Z-1-x86_64.pkg.tar.zst      Arch (also consumed by the AUR nebula-bin package)
#   nebula-windows-x86_64.zip              Windows 10 1809+ / 11 portable build (used by install.ps1)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the project version
        run: |
          v=$(sed -n 's/^project(nebula VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != CMakeLists.txt version $v"; exit 1; }

  bundle:
    needs: version
    strategy:
      fail-fast: false
      # x86_64 is built on 22.04 (glibc 2.35, runs almost everywhere); the official Qt for aarch64 needs glibc >= 2.38,
      # so that one is built on 24.04 (glibc 2.39)
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: packaging/release/bundle.sh "${GITHUB_REF_NAME#v}" dist
      - name: Smoke test the bundle
        run: |
          tar -xzf dist/nebula-linux-*.tar.gz -C "$RUNNER_TEMP"
          tests/qml_sanity.sh "$RUNNER_TEMP/nebula/bin/nebula"
      - uses: actions/upload-artifact@v4
        with: { name: 'bundle-${{ matrix.runner }}', path: dist/* }

  native:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: deb, image: 'debian:trixie', runner: ubuntu-latest }
          - { kind: deb, image: 'debian:trixie', runner: ubuntu-24.04-arm }
          - { kind: rpm, image: 'fedora:42', runner: ubuntu-latest }
          - { kind: rpm, image: 'fedora:42', runner: ubuntu-24.04-arm }
          - { kind: arch, image: 'archlinux:latest', runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      # builds, installs the package in this container and runs the QML sanity test against /usr/bin/nebula
      - run: packaging/release/native.sh ${{ matrix.kind }} dist
      - uses: actions/upload-artifact@v4
        with: { name: '${{ matrix.kind }}-${{ matrix.runner }}', path: dist/* }

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - name: Build the portable zip
        shell: bash
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/release/windows.ps1 -Version "${GITHUB_REF_NAME#v}" -Out dist
      - name: Smoke test the bundle without this machine's Qt
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Zip dist/nebula-windows-x86_64.zip -Dir "$RUNNER_TEMP/nebula-installed"
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QT_ROOT_DIR Qt6_DIR QTDIR QT_QPA_PLATFORM_PLUGIN_PATH
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -vi '/Qt/' | paste -sd:)
          ./tests/e2e_windows.sh "$RUNNER_TEMP/nebula-installed/nebula.exe"
      - uses: actions/upload-artifact@v4
        with: { name: bundle-windows, path: 'dist/nebula-windows-x86_64.zip' }

  publish:
    needs: [bundle, native, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "nebula ${GITHUB_REF_NAME#v}" --generate-notes
