name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # nebula needs Qt >= 6.5, newer than Ubuntu LTS ships, so build on Arch.
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-declarative libvterm python
      - uses: actions/checkout@v4
      - name: Configure and build (Debug)
        run: |
          cmake -S . -B build-dev -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-dev
      - name: Unit tests
        run: ctest --test-dir build-dev --output-on-failure
      - name: End-to-end (API, sessions, agents)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./tests/e2e.sh ./build-dev/nebula
          ./tests/e2e_persist.sh ./build-dev/nebula
          ./tests/e2e_agents.sh ./build-dev/nebula
