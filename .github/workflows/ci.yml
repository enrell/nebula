name: ci

on:
  push:
    branches: [main, claude/charming-hopper-5cfd81]   # TEMP: run CI on this branch before a PR exists
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # nebula needs Qt >= 6.5, newer than Ubuntu LTS ships, so build on Arch.
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-declarative qt6-webengine qt6-webchannel libvterm python nodejs npm
      - uses: actions/checkout@v4
      - name: Views renderer (checker tests; the committed dist/ must match the sources)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd renderer && npm ci && npm test
          git diff --exit-code -- dist || { echo "renderer/dist is stale: run 'just renderer' and commit it"; exit 1; }
      - name: Configure and build (Debug)
        run: |
          cmake -S . -B build-dev -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-dev
      - name: Unit tests
        run: ctest --test-dir build-dev --output-on-failure
      - name: End-to-end (API, sessions, agents)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./tests/e2e.sh ./build-dev/nebula
          ./tests/e2e_persist.sh ./build-dev/nebula
          ./tests/e2e_agents.sh ./build-dev/nebula
          ./tests/e2e_views.sh ./build-dev/nebula
      - name: QML sanity (release build, AOT-compiled QML)
        run: |
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rel
          ./tests/qml_sanity.sh ./build-rel/nebula

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - name: Configure and build (Release, bundled libvterm)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Unit tests (agent detection, view checker, the Win32 layer on a real pseudo console)
        run: ctest --test-dir build --output-on-failure
      - name: Package (portable folder with Qt, as the release builds it)
        run: ./packaging/release/windows.ps1 -Version 0.0.0-ci -Out dist -Build build
      - name: Install with install.ps1 and run the end-to-end test on the installed copy, without this machine's Qt
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Zip dist/nebula-windows-x86_64.zip -Dir "$RUNNER_TEMP/nebula-installed"
          # the installed folder must stand on its own: take Qt out of the environment
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QT_ROOT_DIR Qt6_DIR QTDIR QT_QPA_PLATFORM_PLUGIN_PATH
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -vi '/Qt/' | paste -sd:)
          ./tests/e2e_windows.sh "$RUNNER_TEMP/nebula-installed/nebula.exe"
      - name: Screenshot on a real Windows window
        if: always()
        shell: bash
        run: |
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QT_ROOT_DIR Qt6_DIR QTDIR QT_QPA_PLATFORM_PLUGIN_PATH
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -vi '/Qt/' | paste -sd:)
          ./tests/shot_windows.sh "$RUNNER_TEMP/nebula-installed/nebula.exe" shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nebula-windows, path: 'shots/*', if-no-files-found: ignore }
      - name: TEMP print the screenshot into the log
        if: always()
        shell: bash
        run: |
          echo "===PNG-BEGIN==="
          base64 -w0 shots/nebula-windows.png || true
          echo
          echo "===PNG-END==="

