name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    # nebula needs Qt >= 6.5, newer than Ubuntu LTS ships, so build on Arch.
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-declarative qt6-webengine qt6-webchannel libvterm python nodejs npm
      - uses: actions/checkout@v4
      - name: Views renderer (checker tests; the committed dist/ must match the sources)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd renderer && npm ci && npm test
          git diff --exit-code -- dist || { echo "renderer/dist is stale: run 'just renderer' and commit it"; exit 1; }
      - name: Configure and build (Debug)
        run: |
          cmake -S . -B build-dev -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-dev
      - name: Unit tests
        run: ctest --test-dir build-dev --output-on-failure
      - name: End-to-end (API, sessions, agents)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./tests/e2e.sh ./build-dev/nebula
          ./tests/e2e_persist.sh ./build-dev/nebula
          ./tests/e2e_agents.sh ./build-dev/nebula
          ./tests/e2e_views.sh ./build-dev/nebula
      - name: QML sanity (release build, AOT-compiled QML)
        run: |
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rel
          ./tests/qml_sanity.sh ./build-rel/nebula
